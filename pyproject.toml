[project]
name = "catalogflow"
version = "1.0.0"
description = "AI-powered web application that extracts structured product, commercial, and packaging data from catalog and brochure PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "json-repair>=0.63.2",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.11",
    "opendataloader-pdf>=2.5.0",
    "openrouter>=0.11.46",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.2",
    "qdrant-client[fastembed]>=1.19.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
